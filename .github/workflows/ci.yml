name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build + test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Runs the full suite under c8, so the server, proxy, and CLI tests that
      # spawn the built dist/ bins are counted; an in-process provider sees
      # none of that. Global thresholds live in .c8rc.json and per-directory
      # floors in scripts/coverage-gate.mjs; either one fails the job. This is
      # a superset of `npm test`, which is why the suite runs once.
      - name: Test + coverage (builds first)
        run: npm run test:coverage

      # Coverage is deterministic across machines, but the suite spawns child
      # processes and Node only flushes coverage on a clean exit. If the gate
      # ever fails, keep the report so the cause is diagnosable instead of lost.
      - name: Upload coverage on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Lint
        run: npm run lint

      # Dogfood: the analyzer must pass on its own repository with the
      # committed config + waivers. Exit 1 (findings) or 2 (can't
      # analyze) fails the job.
      - name: Self check
        run: node dist/server/index.js check .
