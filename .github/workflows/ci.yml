name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build + test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The uninstrumented suite. Coverage runs pre-push instead: c8 makes the
      # process-spawning suites roughly an order of magnitude slower, which put
      # the slowest property test over vitest's 30s timeout on CI hardware.
      - name: Test (builds first)
        run: npm test

      # tsconfig.json excludes tests and vitest strips types without checking,
      # so without this step a type error anywhere in tests/ lands green.
      - name: Typecheck tests
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Dogfood: the analyzer must pass on its own repository with the
      # committed config + waivers. Exit 1 (findings) or 2 (can't
      # analyze) fails the job.
      - name: Self check
        run: node dist/server/index.js check .
