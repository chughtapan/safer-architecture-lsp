name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build + test + lint
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default depth-1 fetch: the whitespace check below
      # diffs against origin/main, and a shallow clone has neither that ref nor
      # a common ancestor for the three-dot range to resolve.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The uninstrumented suite. Coverage runs pre-push instead: c8 makes the
      # process-spawning suites roughly an order of magnitude slower, which put
      # the slowest property test over vitest's 30s timeout on CI hardware.
      - name: Test (builds first)
        run: npm test

      # tsconfig.json excludes tests and vitest strips types without checking,
      # so without this step a type error anywhere in tests/ lands green.
      - name: Typecheck tests
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Covers what eslint cannot: markdown, YAML, and JSON. The range form is
      # required - bare `git diff --check` only compares the working tree to the
      # index, so it sees nothing once a change is staged or committed.
      - name: Whitespace check
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD

      # Dogfood: the analyzer must pass on its own repository with the
      # committed config + waivers. Exit 1 (findings) or 2 (can't
      # analyze) fails the job.
      - name: Self check
        run: node dist/server/index.js check .
